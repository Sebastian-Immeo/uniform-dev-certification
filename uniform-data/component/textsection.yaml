id: textsection
name: Text Section
icon: image-text
parameters:
  - id: header
    name: Header
    type: text
    typeConfig: null
    localizable: true
  - id: description
    name: Description
    type: richText
    typeConfig:
      elements:
        builtIn:
          - h1
          - h2
          - h3
          - h4
          - h5
          - h6
          - unorderedList
          - orderedList
          - link
          - quote
          - code
          - table
          - asset
          - variable
      required: false
      formatting:
        builtIn:
          - bold
          - italic
          - underline
          - strikethrough
          - code
          - superscript
          - subscript
      elementsConfig:
        asset:
          allowedTypes:
            - image
    localizable: true
  - id: width
    name: width
    type: select
    helpText: Controls the width of the element.
    typeConfig:
      options:
        - text: Full
          value: full
        - text: Half
          value: half
