# yaml-language-server: $schema=https://eu.uniform.app/schemas/json-schema/component-definition/v1.json
$schema: https://eu.uniform.app/schemas/json-schema/component-definition/v1.json
id: textField
name: Text Field
icon: rename
parameters:
  - id: label
    name: Label
    type: text
    typeConfig:
      required: true
    localizable: true
  - id: name
    name: Salesforce Form Field Name
    type: text
    helpText: >-
      This has to match the name of the corresponding form field name in
      Salesforce. Be sure to check this is the case.
    typeConfig:
      required: true
  - id: placeholder
    name: Placeholder
    type: text
    typeConfig: null
    localizable: true
  - id: width
    name: Width
    type: select
    helpText: Determines the width of the component.
    typeConfig:
      options:
        - text: Full
          value: full
        - text: Half
          value: half
  - id: required
    name: Required
    type: checkbox
    helpText: Makes field required. Users cannot send the form before it is filled in.
    typeConfig: null
  - id: hidden
    name: Hidden
    type: checkbox
    helpText: >-
      Hides the form field from the UI, allowing you to send additional data
      related to the submission to Salesforce.
    typeConfig: null
  - id: staticValue
    name: Static Value
    type: text
    helpText: >-
      Used with the is hidden field to send certain data to salesforce when form
      is submitted.
    typeConfig: null
    localizable: true
categoryId: 26961017-5174-4b69-8864-c06156ebee53
useTeamPermissions: true
slots: []
titleParameter: label
canBeComposition: false
created: '2025-09-19T09:09:27.323708+00:00'
updated: '2025-10-01T15:20:43.107941+00:00'
variants:
  - id: dark
    name: Dark
