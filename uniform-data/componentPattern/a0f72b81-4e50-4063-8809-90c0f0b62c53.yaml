    formTermsText:
      type: richText
      locales:
        en:
          root:
            type: root
            format: ''
            indent: 0
            version: 1
            children:
              - type: paragraph
                format: ''
                indent: 0
                version: 1
                children:
                  - mode: normal
                    text: "You can unsubscribe emails at any time through links in the emails you receive, and you can withdraw your consent at any time by contacting\_FORCE Technology's marketing department."
                    type: text
                    style: ''
                    detail: 0
                    format: 0
                    version: 1
                direction: ltr
                textStyle: ''
                textFormat: 0
              - type: paragraph
                format: ''
                indent: 0
                version: 1
                children: []
                direction: ltr
                textStyle: ''
                textFormat: 0
              - type: paragraph
                format: ''
                indent: 0
                version: 1
                children:
                  - mode: normal
                    text: "FORCE Technology collects and stores personal information. Further information about your personal data and your rights is contained in FORCE Technology's\_personal data policy.\L\_"
                    type: text
                    style: ''
                    detail: 0
                    format: 0
                    version: 1
                direction: ltr
                textStyle: ''
                textFormat: 0
            direction: ltr
    lastNameLabel:
      type: text
      locales:
        da: Efternavn
        en: Last name
    closeAriaLabel:
      type: text
      locales:
        da: Luk formular
        en: Close form
    countryOptions:
      type: $block
      value: >-
        ${#jptr:/Form Dropdown Field
        Content/entries/0/entry/fields/options/value}
    firstNameLabel:
      type: text
      locales:
        da: Navn
        en: Name
    formErrorTitle:
      type: text
      locales:
        da: Fejl
        en: Error
    acceptTermsLabel:
      type: text
      locales:
        da: >-
          Ja, jeg giver hermed mit samtykke til, at FORCE Technology og
          koncernselskaber må sende mig information og markedsføringsmateriale i
          form af e-mails med nyheder, artikler, cases og lignende, samt
          information om events, kurser og lignende.
        en: >-
          Yes, I hereby give my consent to FORCE Technology and group companies
          to send me information and marketing material in the form of e-mails
          with news, articles, cases and the like, as well as information about
          events, courses and the like.
    emailPlaceholder:
      type: text
      locales:
        da: Skriv din email
        en: Enter email
    formErrorMessage:
      type: text
      locales:
        da: Der skete noget uventet. Prøv venligst igen senere.
        en: Something unexpected happend. PLease try again later.
    submitButtonText:
      type: text
      locales:
        da: Send
        en: Submit
    termsToBeAccpted:
      type: select
      value: permission_store_and_process
    formSuccesMessage:
      type: text
      locales:
        da: >-
          Tak for din tilmelding!

          Du vil snart modtage en bekræftelsesmail. Bemærk venligst: Hvis du
          ikke modtager en bekræftelsesmail, så tjek venligst dit spamfilter.
        en: "Thank you for registering!\L\nYou will receive an e-mail confirmation mail shortly. Please note:\_If you do not receive a confirmation e-mail,\_ please check your spam filter."
    companyPlaceholder:
      type: text
      locales:
        da: Skriv virksomhedsnavn
        en: Enter company name
    countryPlaceholder:
      type: text
      locales:
        da: Skriv land
        en: >-
          ${#jptr:/Form Dropdown Field
          Content/entries/0/entry/fields/placeholder/value}
    lastNamePlaceholder:
      type: text
      locales:
        da: Skriv dit efternavn
        en: Enter last name
    firstNamePlaceholder:
      type: text
      locales:
        da: Skriv dit navn
        en: Enter name
    acceptMarketingTermsLabel:
      type: text
      locales:
        da: Jeg accepterer, at FORCE Technology indsamler mine data.
        en: I accept that FORCE Technology collects my data.
